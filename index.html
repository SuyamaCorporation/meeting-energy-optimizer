<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会議エネルギーコスト最適化ツール</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-center mb-2 text-rose-400">会議エネルギーコスト最適化ツール</h1>
  <p class="text-center text-gray-400 mb-8 text-sm">参加人数・平均時給・時間でリアルタイムコストを可視化</p>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
    <div class="bg-gray-800 rounded-xl p-6">
      <h2 class="text-lg font-semibold mb-4 text-rose-300">会議設定</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-gray-400 mb-1" for="participants">参加人数</label>
          <input id="participants" type="number" min="1" max="200" value="8" class="w-full bg-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-rose-500" aria-label="参加人数">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1" for="hourlyRate">平均時給（円）</label>
          <input id="hourlyRate" type="number" min="500" max="50000" value="4000" class="w-full bg-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-rose-500" aria-label="平均時給（円）">
          <div class="text-xs text-gray-500 mt-1">年収600万円→時給2,885円目安</div>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1" for="duration">会議時間（分）</label>
          <input id="duration" type="range" min="5" max="240" value="60" class="w-full accent-rose-500" aria-label="会議時間（分）">
          <div class="flex justify-between text-xs text-gray-500">
            <span>5分</span>
            <span id="durationVal" class="text-rose-300 font-mono font-bold">60分</span>
            <span>240分</span>
          </div>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1" for="weeklyFreq">週次頻度（回/週）</label>
          <input id="weeklyFreq" type="number" min="1" max="21" value="3" class="w-full bg-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-rose-500" aria-label="週次頻度">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1" for="meetingNote">会議メモ（任意）</label>
          <input id="meetingNote" type="text" placeholder="週次定例・企画会議等" class="w-full bg-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-rose-500" aria-label="会議メモ">
        </div>
        <button id="saveLog" class="w-full bg-gray-600 hover:bg-gray-500 text-white font-semibold py-2 px-4 rounded-lg transition-colors" aria-label="会議ログを保存">ログを保存</button>
      </div>
    </div>

    <div class="bg-gray-800 rounded-xl p-6">
      <h2 class="text-lg font-semibold mb-4 text-yellow-300">コスト表示</h2>
      <div class="space-y-4">
        <div class="bg-gray-700 rounded-xl p-5 text-center">
          <div class="text-xs text-gray-400 mb-1">この会議のコスト</div>
          <div id="meetingCost" class="text-5xl font-bold text-rose-300">-</div>
          <div class="text-sm text-gray-400 mt-1">円 / 1回</div>
        </div>
        <div class="bg-gray-700 rounded-xl p-4 text-center">
          <div class="text-xs text-gray-400 mb-1">月次コスト（週<span id="freqInLabel">3</span>回換算）</div>
          <div id="monthlyCost" class="text-3xl font-bold text-orange-300">-</div>
          <div class="text-sm text-gray-400">円 / 月</div>
        </div>
        <div class="bg-gray-700 rounded-xl p-4 text-center">
          <div class="text-xs text-gray-400 mb-1">年間コスト</div>
          <div id="yearlyCost" class="text-3xl font-bold text-yellow-300">-</div>
          <div class="text-sm text-gray-400">円 / 年</div>
        </div>
        <div class="bg-green-900/30 border border-green-800/50 rounded-xl p-4">
          <div class="text-xs text-green-300 mb-1">30分短縮した場合の年間節約額</div>
          <div id="savingsAmount" class="text-2xl font-bold text-green-300">-</div>
          <div class="text-sm text-gray-400">円 / 年</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-gray-800 rounded-xl p-6">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-semibold text-gray-300">会議ログ <span class="text-sm text-gray-500 font-normal">(集計)</span></h2>
      <button id="clearLogs" class="text-xs bg-red-900/50 hover:bg-red-900 text-red-300 px-2 py-1 rounded" aria-label="ログを全削除">全削除</button>
    </div>
    <div id="logStats" class="text-sm text-gray-400 mb-3"></div>
    <div id="logList" class="space-y-2 max-h-48 overflow-y-auto"></div>
  </div>
</div>

<script>
function esc(s) { const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }
function fmt(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + '百万';
  if (n >= 10000) return Math.round(n / 1000) + '千';
  return n.toLocaleString('ja-JP');
}

function update() {
  const p = parseInt(document.getElementById('participants').value) || 1;
  const rate = parseInt(document.getElementById('hourlyRate').value) || 1000;
  const dur = parseInt(document.getElementById('duration').value) || 60;
  const freq = parseInt(document.getElementById('weeklyFreq').value) || 1;

  const costPerMeeting = Math.round(p * rate * (dur / 60));
  const monthly = Math.round(costPerMeeting * freq * 4.33);
  const yearly = Math.round(costPerMeeting * freq * 52);
  const savings30 = Math.round(p * rate * (30 / 60) * freq * 52);

  document.getElementById('meetingCost').textContent = fmt(costPerMeeting);
  document.getElementById('monthlyCost').textContent = fmt(monthly);
  document.getElementById('yearlyCost').textContent = fmt(yearly);
  document.getElementById('savingsAmount').textContent = fmt(savings30);
  document.getElementById('durationVal').textContent = dur + '分';
  document.getElementById('freqInLabel').textContent = freq;
}

function loadLogs() {
  const logs = JSON.parse(localStorage.getItem('meetingLogs') || '[]');
  const container = document.getElementById('logList');
  const statsEl = document.getElementById('logStats');
  container.innerHTML = '';

  if (logs.length === 0) {
    container.innerHTML = '<div class="text-gray-500 text-xs">ログなし</div>';
    statsEl.textContent = '';
    return;
  }

  let totalCost = 0;
  logs.forEach(l => { totalCost += l.cost; });
  statsEl.textContent = `${logs.length}件 / 合計コスト: ${totalCost.toLocaleString('ja-JP')}円`;

  logs.slice().reverse().forEach((item, idx) => {
    const realIdx = logs.length - 1 - idx;
    const div = document.createElement('div');
    div.className = 'bg-gray-700 rounded-lg px-3 py-2 flex justify-between items-center';
    div.innerHTML = `
      <div>
        <div class="text-xs text-gray-300 font-medium">${esc(item.note || '無名会議')}</div>
        <div class="text-xs text-gray-400">${item.participants}人 × ${item.duration}分 × 時給${item.hourlyRate}円</div>
        <div class="text-xs text-gray-500">${item.date}</div>
      </div>
      <div class="text-right">
        <div class="text-sm font-bold text-rose-300">${item.cost.toLocaleString('ja-JP')}円</div>
        <button class="deleteLogBtn text-xs text-red-400 hover:text-red-300" aria-label="削除" data-idx="${realIdx}">削除</button>
      </div>
    `;
    container.appendChild(div);
  });

  container.querySelectorAll('.deleteLogBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const arr = JSON.parse(localStorage.getItem('meetingLogs') || '[]');
      arr.splice(parseInt(btn.getAttribute('data-idx')), 1);
      localStorage.setItem('meetingLogs', JSON.stringify(arr));
      loadLogs();
    });
  });
}

document.getElementById('saveLog').addEventListener('click', () => {
  const p = parseInt(document.getElementById('participants').value) || 1;
  const rate = parseInt(document.getElementById('hourlyRate').value) || 1000;
  const dur = parseInt(document.getElementById('duration').value) || 60;
  const freq = parseInt(document.getElementById('weeklyFreq').value) || 1;
  const note = document.getElementById('meetingNote').value.trim();
  const cost = Math.round(p * rate * (dur / 60));

  const arr = JSON.parse(localStorage.getItem('meetingLogs') || '[]');
  arr.push({ participants: p, hourlyRate: rate, duration: dur, weeklyFreq: freq, note, cost, date: new Date().toLocaleString('ja-JP') });
  localStorage.setItem('meetingLogs', JSON.stringify(arr));
  loadLogs();
});

document.getElementById('clearLogs').addEventListener('click', () => {
  localStorage.removeItem('meetingLogs');
  loadLogs();
});

['participants','hourlyRate','weeklyFreq'].forEach(id => {
  document.getElementById(id).addEventListener('input', update);
});
document.getElementById('duration').addEventListener('input', update);

update();
loadLogs();
</script>
</body>
</html>
